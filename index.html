<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>妹宝Only you@悟</title>
<meta name="theme-color" content="#7bbeea">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 漂浮装饰：蓝色宝石 / 克罗心 / 星光 -->
<div class="float-deco" id="floatDeco"></div>

<div class="page">

  <!-- 网站名 -->
  <div class="home-top">
    <span class="ch-mark ch-mini" id="homeTopMarkL"></span>
    <span class="home-site" id="homeSiteTitle"></span>
    <span class="ch-mark ch-mini" id="homeTopMarkR"></span>
  </div>

  <header class="home-head">
    <!-- Chrome Hearts 克罗心荆棘十字架 -->
    <div class="home-ornament" id="homeOrnament"></div>
    <h1 class="home-names" id="homeNames"></h1>
    <div class="home-lovenote" id="homeLoveNote"></div>
    <p class="home-slogan" id="homeSlogan"></p>
  </header>

  <!-- 六个入口 -->
  <div class="hearts" id="hearts"></div>

  <div class="home-footer" id="homeFooter">♱ made with love ♱</div>
</div>

<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var boot = LN.boot({});
  var g = boot.g;
  var home = SITE_CONFIG.home || {};
  var esc = LN.esc;
  var CROSS = '<svg viewBox="0 0 100 140" aria-hidden="true"><use href="#ln-cross"/></svg>';

  /* 顶部网站名：妹宝Only you@悟 */
  var site = g.siteTitle || 'Love Note';
  document.title = site;
  document.getElementById('homeSiteTitle').textContent = site;
  document.getElementById('homeTopMarkL').innerHTML = CROSS;
  document.getElementById('homeTopMarkR').innerHTML = CROSS;

  /* 顶部克罗心徽记 */
  document.getElementById('homeOrnament').innerHTML = LN.crossMark('round');

  /* 情侣名：花见玉子 & 五条悟 —— 拆成两个名字，中间用 & 徽章连接 */
  var namesBox = document.getElementById('homeNames');
  var names = String(g.coupleNames || '').split(/[&＆+＋]/)
    .map(function (s) { return s.trim(); })
    .filter(Boolean);
  if (names.length >= 2) {
    namesBox.innerHTML = names.map(function (n) {
      return '<span class="hn">' + esc(n) + '</span>';
    }).join('<span class="hn-join" aria-hidden="true">&amp;</span>');
    namesBox.setAttribute('aria-label', names.join(' 和 '));
  } else {
    namesBox.textContent = g.coupleNames || '';
  }

  /* 其余文案 */
  document.getElementById('homeLoveNote').textContent = g.loveNoteText || 'love note';
  document.getElementById('homeSlogan').textContent = g.slogan || '';

  /* 渲染入口卡片（缺失的新页面入口会自动补齐） */
  var heartsBox = document.getElementById('hearts');
  LN.mergeHearts(home.hearts).forEach(function (h) {
    var item = document.createElement('div');
    item.className = 'heart-item';

    var btn = document.createElement('a');
    btn.className = 'heart-btn';
    btn.href = h.url || '#';
    btn.style.setProperty('--heart-color', h.color || '#8ecbf2');
    btn.innerHTML =
      '<span class="heart-accent" aria-hidden="true"></span>' +
      LN.crossMark('heart-ch') +
      '<span class="heart-content">' +
        '<span class="heart-icon">' + esc(h.icon) + '</span>' +
        '<span class="heart-label">' + esc(h.label) + '</span>' +
      '</span>';

    var sub = document.createElement('div');
    sub.className = 'heart-sub';
    sub.textContent = h.subLabel || '';

    item.appendChild(btn);
    item.appendChild(sub);
    heartsBox.appendChild(item);
  });
})();
</script>
</body>
</html>
